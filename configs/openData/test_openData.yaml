trainer:
  accelerator: auto
  default_root_dir: runs/test_openData/
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        mode: min
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 20
        mode: min
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
  log_every_n_steps: 1
  max_epochs: 50
  limit_train_batches: 1.0
  limit_val_batches: 1.0

data:
  class_path: data.datasets.CMSOpenData
  init_args:
    loadMC: true
    include_higgs: false
    pfn_style: true
    use_minor_bkg: false
    batch_size: 2048
    num_workers: 1

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 5e-4

#lr_scheduler:
#  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
#  init_args:
#    T_max: 100
#    eta_min: 1e-5

model:
  class_path: models.litmodels.SimCLRModel
  init_args:
   #encoder:
   #   class_path: models.networks.MLP
   #   init_args:
   #     input_dim: 24
   #     hidden_dims: [256, 512, 512, 256]
   #     output_dim: 4 # dimension of contrastive space
    encoder:
      class_path: models.networks.DeepSetsEncoder
      init_args:
        phi:
          class_path: models.networks.MLP
          init_args:
            input_dim: 6 # 6 features per lepton
            hidden_dims: [128, 128, 128]
            output_dim: 128 # dimension of contrastive space
            activation: silu
            dropout: 0.1
        f:
          class_path: models.networks.MLP
          init_args:
            input_dim: 128 # output dimension of phi
            hidden_dims: [256, 512, 256]
            output_dim: 4 # dimension of contrastive space
            activation: silu
            dropout: 0.1
    projector:
      class_path: models.networks.MLP
      init_args:
        input_dim: 4
        hidden_dims: [4]
        output_dim: 4
    classifier: null
    lambda_classifier: 0.1
    temperature: 0.01
    sup_simclr: true